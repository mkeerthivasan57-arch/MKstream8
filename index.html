
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title id="site-title">MKstream</title>
<meta name="description" id="meta-desc" content="MKstream - Watch anime, donghua, cartoons, serials, web series, movies">
<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>
<body class="theme-dark">
  <div class="site-root">
    <header class="site-header">
      <div class="left">
        <button id="hamburger" class="hamburger" aria-label="menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <div id="brand" class="brand" role="button" tabindex="0">MKstream</div>
      </div>

      <nav class="categories-desktop" id="categories-desktop" aria-hidden="false"></nav>

      <div class="right">
        <button id="search-toggle" class="icon-btn" aria-label="search">🔍</button>
        <a id="admin-open" class="admin-pill" href="admin.html">Admin</a>
      </div>
    </header>

    <aside id="sidebar" class="sidebar" aria-hidden="true">
      <div class="sidebar-top">
        <div class="brand">MKstream</div>
        <button id="sidebar-close" class="close-x" aria-label="Close menu">✖</button>
      </div>
      <div id="sidebar-links" class="sidebar-links">
        <button class="side-link" data-link="index.html">🏠 Home</button>
      </div>
      <hr>
      <div class="sidebar-cats" id="sidebar-cats"></div>
    </aside>

    <div id="search-overlay" class="overlay hidden" role="dialog" aria-hidden="true">
      <div class="overlay-inner">
        <div class="search-row">
          <input id="search-input" class="input" placeholder="Search series or episodes..." autofocus>
          <button id="search-close" class="btn">Close</button>
        </div>
        <div id="search-results"></div>
      </div>
    </div>

    <main class="container">
      <section id="specials" class="section">
        <h2>Today's Specials</h2>
        <div id="specials-grid" class="grid"></div>
      </section>

      <section id="recent" class="section">
        <h2>Recently Uploaded</h2>
        <div id="recent-grid" class="grid"></div>
        <div class="pager center"><button id="recent-load-more" class="btn">Load more</button></div>
      </section>

      <section id="most" class="section">
        <h2>Most Viewed</h2>
        <div id="most-grid" class="grid"></div>
        <div class="pager center"><button id="most-load-more" class="btn">Load more</button></div>
      </section>
    </main>

    <footer class="site-footer">
      <div>© <span id="year"></span> MKstream</div>
    </footer>
  </div>

<!-- mk_apply_edits hook -->
<script>
function mk_apply_edits(){
  try{
    const edits = JSON.parse(localStorage.getItem('mk_web_edits')||'{}');
    const page = location.pathname.split('/').pop() || 'index.html';
    const list = edits[page] || [];
    // Apply each edit by position
    list.forEach(e=>{
      try{
        if(e.type==='fullpage_replace' && e.content){
          // full page replace not applied on client for safety
        } else if(e.type==='section'){
          const node = document.createElement('section');
          node.innerHTML = '<h3>'+ (e.title||'') +'</h3>' + (e.content||'');
          document.getElementById('mk_main')?.appendChild(node);
        } else if(e.type==='text' || e.type==='ad'){
          const node = document.createElement('div'); node.className='mk-edit-'+e.type; node.innerHTML = e.content || '';
          if(e.position==='header') document.getElementById('mk_header')?.appendChild(node);
          else if(e.position==='before-content') document.getElementById('mk_main')?.insertBefore(node, document.getElementById('mk_main').firstChild);
          else if(e.position==='after-content') document.getElementById('mk_main')?.appendChild(node);
          else if(e.position==='footer') document.getElementById('mk_footer')?.appendChild(node);
        } else if(e.type==='image'){
          const img = document.createElement('img'); img.src = e.content;
          if(e.position==='header') document.getElementById('mk_header')?.appendChild(img);
          else if(e.position==='footer') document.getElementById('mk_footer')?.appendChild(img);
          else document.getElementById('mk_main')?.appendChild(img);
        } else if(e.type==='video'){
          const iframe = document.createElement('iframe'); iframe.src = e.content; iframe.width='100%'; iframe.height='280'; iframe.allow='autoplay; encrypted-media'; iframe.style.border='0';
          document.getElementById('mk_main')?.appendChild(iframe);
        }
      }catch(err){ console.error('mk apply error',err); }
    });
    // Telegram link
    const tg = localStorage.getItem('mk_telegram')||'';
    if(tg){
      const el = document.createElement('div'); el.className='mk-telegram'; el.innerHTML = '<a href="'+tg+'" target="_blank">Open Telegram</a>';
      document.getElementById('mk_footer')?.appendChild(el);
    }
  }catch(e){ console.error(e); }
}
document.addEventListener('DOMContentLoaded', mk_apply_edits);
window.addEventListener('storage', function(e){ if(e.key && e.key.startsWith('mk_')){ try{ mk_apply_edits(); }catch(err){} } });
</script>
<!-- end mk_apply_edits hook -->

</body>
</html>
